name: Release

# ═══════════════════════════════════════════════════════════════════════
# 优化摘要（对比旧版）
#
# 旧流程关键路径：
#   build-frontend (3min)
#     → build-go [6×ubuntu, 并行] (~4min)
#       → build-rust [6×各平台, 串行等待 Go] (~20min macOS/Win)
#         → package → publish
#   总计 ~30min；macOS 占 2 个 runner
#
# 新流程关键路径：
#   prepare (30s) ─┐
#   build-frontend ─┤ 并行
#   build-go ───────┘
#     → package (下载预编译 Rust, ~30s) → publish
#   总计 ~8-10min；零 Rust 编译开销
#
# 优化点一览：
#   ① Rust 完全剥离 — 产物存 GitHub pre-release（rust-build.yml 维护）
#   ② prepare job 与 build-frontend 并行，提前拿到 Rust hash
#   ③ build-go 全部 ubuntu-latest 纯交叉编译，Go module cache 命中极快
#   ④ 并发控制：同一 tag 只允许一个 release 流水线运行
#   ⑤ 找不到预编译产物时 fail-fast 并给出可操作提示
# ═══════════════════════════════════════════════════════════════════════

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

# 同一 tag 只允许一个 release 运行，防止并发写 release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────
  # 0a. ensure-rust：调用 rust-build.yml（可复用工作流）
  #     产物已存在时 ~30s 秒跳过；不存在时自动编译发布。
  #     完全自愈，无需手动触发。
  # ───────────────────────────────────────────────
  ensure-rust:
    name: Ensure Rust Artifacts
    uses: ./.github/workflows/rust-build.yml
    permissions:
      contents: write
    with:
      force_rebuild: false

  # ───────────────────────────────────────────────
  # 0b. prepare：从 ensure-rust 转发 rust_tag / rust_hash
  #     供下游 package job 使用
  # ───────────────────────────────────────────────
  prepare:
    name: Prepare
    needs: ensure-rust
    runs-on: ubuntu-latest
    outputs:
      rust_hash: ${{ needs.ensure-rust.outputs.rust_hash }}
      rust_tag:  ${{ needs.ensure-rust.outputs.rust_tag }}
    steps:
      - name: Echo rust tag
        run: |
          echo "rust_tag=${{ needs.ensure-rust.outputs.rust_tag }}"
          echo "rust_hash=${{ needs.ensure-rust.outputs.rust_hash }}"

  # ───────────────────────────────────────────────
  # 1. 构建前端
  # ───────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        run: make build-ui

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/dist
          retention-days: 1

  # ───────────────────────────────────────────────
  # 2. 交叉编译 Go 二进制（全部在 ubuntu-latest，CGO=0）
  #    与 prepare 并行，等 frontend 完成后即启动
  # ───────────────────────────────────────────────
  build-go:
    name: Build Go (${{ matrix.name }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true   # 任一平台失败立即取消其余，避免浪费
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            cargo_target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            goos: linux
            goarch: arm64
            cargo_target: aarch64-unknown-linux-gnu
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            cargo_target: aarch64-apple-darwin
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            cargo_target: x86_64-apple-darwin
          - name: windows-amd64
            goos: windows
            goarch: amd64
            cargo_target: x86_64-pc-windows-msvc
            binary_suffix: ".exe"
          - name: windows-arm64
            goos: windows
            goarch: arm64
            cargo_target: aarch64-pc-windows-msvc
            binary_suffix: ".exe"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true          # 缓存 GOPATH/pkg/mod 和 ~/.cache/go-build

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/dist

      - name: Build Go binary (cross-compile)
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CARGO_TARGET: ${{ matrix.cargo_target }}
          SKIP_RUST_BUILD: 1
          VERSION: ${{ github.ref_name }}
        run: make build-backend

      - name: Rename binary (Windows)
        if: matrix.binary_suffix == '.exe'
        run: mv bin/polaris bin/polaris.exe

      - uses: actions/upload-artifact@v7
        with:
          name: go-${{ matrix.name }}
          path: bin/polaris${{ matrix.binary_suffix }}
          retention-days: 1

  # ───────────────────────────────────────────────
  # 3. 打包发布（依赖 build-go + prepare）
  #    Rust 产物直接从 pre-release 下载，无编译开销
  # ───────────────────────────────────────────────
  package:
    name: Package (${{ matrix.name }})
    needs: [build-go, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            archive_format: tar.gz
            rust_artifact: libsubstrate-linux-amd64.so
            rust_libname:  libsubstrate.so
          - name: linux-arm64
            archive_format: tar.gz
            rust_artifact: libsubstrate-linux-arm64.so
            rust_libname:  libsubstrate.so
          - name: darwin-arm64
            archive_format: tar.gz
            rust_artifact: libsubstrate-darwin-arm64.dylib
            rust_libname:  libsubstrate.dylib
          - name: darwin-amd64
            archive_format: tar.gz
            rust_artifact: libsubstrate-darwin-amd64.dylib
            rust_libname:  libsubstrate.dylib
          - name: windows-amd64
            archive_format: zip
            rust_artifact: substrate-windows-amd64.dll
            rust_libname:  substrate.dll
          - name: windows-arm64
            archive_format: zip
            rust_artifact: substrate-windows-arm64.dll
            rust_libname:  substrate.dll
    steps:
      - uses: actions/checkout@v7

      - name: Download Go binary
        uses: actions/download-artifact@v8
        with:
          name: go-${{ matrix.name }}
          path: bin

      # 从 pre-release 下载对应平台的预编译 Rust .so / .dylib / .dll
      - name: Download prebuilt Rust artifact
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ needs.prepare.outputs.rust_tag }}
          ARTIFACT: ${{ matrix.rust_artifact }}
          LIBNAME:  ${{ matrix.rust_libname }}
        run: |
          mkdir -p bin/lib
          gh release download "$TAG" \
            --pattern "$ARTIFACT" \
            --dir bin/lib \
            --clobber
          # 重命名为运行时期望的规范文件名
          if [ "$ARTIFACT" != "$LIBNAME" ]; then
            mv "bin/lib/$ARTIFACT" "bin/lib/$LIBNAME"
          fi

      - name: Package release archive
        run: |
          ARCHIVE_NAME="polaris-${{ matrix.name }}"
          mkdir -p "release_pkg/${ARCHIVE_NAME}"
          cp -r bin/polaris* "release_pkg/${ARCHIVE_NAME}/"   # binary (含 .exe)
          cp -r bin/lib      "release_pkg/${ARCHIVE_NAME}/"   # Rust dylib
          cp -r configs      "release_pkg/${ARCHIVE_NAME}/"
          cp LICENSE         "release_pkg/${ARCHIVE_NAME}/"
          cd release_pkg
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            zip -r "../${ARCHIVE_NAME}.zip" "${ARCHIVE_NAME}"
          else
            tar -czvf "../${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          fi
          cd ..
          sha256sum ${ARCHIVE_NAME}.${{ matrix.archive_format }} \
            > ${ARCHIVE_NAME}.${{ matrix.archive_format }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: polaris-${{ matrix.name }}
          path: polaris-${{ matrix.name }}.*
          retention-days: 1

  # ───────────────────────────────────────────────
  # 4. 发布 GitHub Release
  # ───────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: polaris-*
          path: artifacts
          merge-multiple: true

      # ─────────────────────────────────────────────────────────────
      # 供应链签名（ADR-0095 决策二）
      #
      # 签的是每个 <archive>.sha256 而非归档本身：客户端本来就要下载 .sha256，
      # 签名让这个几十字节的文件变得可信，归档的完整性再由其中的 SHA-256 承接。
      # 一次签名同时锚住"校验值"与"归档"，且客户端无需把整个归档喂给验签器。
      #
      # 这直接消解了 mirror 降级问题：校验值即使取自 ghproxy 镜像也无法被伪造，
      # 因为镜像没有私钥。见 internal/sysmgr/updater/anchorChecksumTrust。
      #
      # 状态判定不在此处写 shell，而是调用 tools/release_signing_gate.go：
      # 签名是流水线与客户端的**双侧协议**，两侧对"现在是否该有签名"的判断必须
      # 永远一致。若这里用 `[ -n "$COSIGN_PRIVATE_KEY" ]` 自判一套、客户端用
      # Go 判另一套，两套迟早漂移，而漂移的表现是"发出去的包客户端装不上"。
      # 现在两侧读同一个信任根（releasekeys/*.pem）、跑同一个函数
      # （updater.ResolveSigningState，四象限见其文档注释与单测）。
      #
      # 四象限中三种放行、一种阻断：
      #   无公钥无私钥 → 跳过签名（本特性落地初期的正常态，发布不受影响）
      #   有私钥无公钥 → 签，但告警：此刻还没有客户端会验它
      #   公钥私钥齐备 → 签 + 对照**已提交的公钥**自验
      #   有公钥无私钥 → **阻断**：客户端已 fail-closed，此时发不带签名的 release
      #                  会被每一个已升级客户端拒绝安装，而流水线本身全绿
      # ─────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Resolve release signing state
        id: signing
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: env GOOS= GOARCH= go run tools/release_signing_gate.go >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: steps.signing.outputs.should_sign == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign checksum files
        if: steps.signing.outputs.should_sign == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD:    ${{ secrets.COSIGN_PASSWORD }}
          SIGNING_STATE:      ${{ steps.signing.outputs.state }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.sha256)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::artifacts/ 下没有 .sha256 文件，package 阶段产物异常"
            exit 1
          fi
          for f in "${files[@]}"; do
            cosign sign-blob --yes \
              --key env://COSIGN_PRIVATE_KEY \
              --output-signature "$f.sig" \
              "$f"
            echo "signed: $f -> $f.sig"
          done

          # ── 自验：必须对照**仓库里已提交的公钥**，而不是从私钥导出的公钥 ──
          #
          # 用 `cosign public-key --key env://COSIGN_PRIVATE_KEY` 导出来验，只能
          # 证明"签名与私钥匹配"——这在数学上恒成立，等于什么都没验。真正要回答的
          # 问题是"客户端二进制里内嵌的那把公钥，验不验得过这个签名"。
          # 两者在轮换场景下会分叉：Secret 换了新私钥而 releasekeys/ 还是旧公钥时，
          # 前一种自验照样全绿，后一种当场报错——而客户端的遭遇与后者一致。
          #
          # 判定语义必须与客户端 verifyWithKeys 一致：**任一**已提交公钥验过即可，
          # 不是每一把都要验过。轮换期 releasekeys/ 会同时存在新旧两把公钥，而
          # 私钥只有一把——要求"每把都验过"会让轮换期的每次发布都失败。
          if [ "$SIGNING_STATE" = "enforced" ]; then
            pubkeys=(internal/sysmgr/updater/releasekeys/*.pem)
            for f in "${files[@]}"; do
              ok=false
              for pub in "${pubkeys[@]}"; do
                if cosign verify-blob --key "$pub" --signature "$f.sig" "$f" 2>/dev/null; then
                  echo "verified: $f <- $(basename "$pub")"
                  ok=true
                  break
                fi
              done
              if [ "$ok" = false ]; then
                echo "::error title=签名自验失败::$f 的签名无法被 releasekeys/ 中任何一把已提交公钥验证。客户端内嵌的正是这些公钥，此包一旦发出，所有已升级客户端都将拒绝安装。最常见原因：Secret 里的私钥已轮换但新公钥尚未提交进 releasekeys/。"
                exit 1
              fi
            done
            echo "全部签名已对照已提交公钥自验通过（${#files[@]} 个产物 / ${#pubkeys[@]} 把公钥）"
          else
            # forward 态：仓库尚无公钥可对照，退而验证签名自洽（至少能拦住
            # cosign 产出损坏文件这类低级故障）。
            cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/derived.pub
            for f in "${files[@]}"; do
              cosign verify-blob --key /tmp/derived.pub --signature "$f.sig" "$f"
            done
            echo "::warning::releasekeys/ 尚无公钥，本次仅做签名自洽性校验；提交 cosign.pub 后才会对照客户端信任根自验"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true

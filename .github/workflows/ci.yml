name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_NET_RETRY: 3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— golangci-lint issues.new-from-rev 需完整历史定位基线
      # commit a3310f9b；浅克隆（默认 depth:1）导致该 rev 不在本地历史中，
      # new-from-rev 静默失效，存量 gochecknoglobals 违规全部当作"新增"上报。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Create mock web dist
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  docs-toc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Create mock web dist
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: docs/arch §跳读 行号一致性
        run: make docs-check
      - name: docs/arch 禁 Go 代码块 / 完整签名 (#9)
        run: make docs-lint
      - name: docs/arch 失效路径引用门控
        run: make docs-refs

  # 单次编译 Rust，产物通过 artifact 传递给下游 job
  # 最终产物缓存：如果 Rust 源码无变化，直接跳过工具链安装和编译
  rust-build:
    runs-on: ubuntu-latest
    outputs:
      rust_unchanged: ${{ steps.rust-final.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust final artifact
        id: rust-final
        uses: actions/cache@v6
        with:
          path: |
            rust/substrate/target/release/libsubstrate.so
            rust/substrate/target/release/libsubstrate.a
          key: rust-ci-x86_64-unknown-linux-gnu-${{ hashFiles('rust/substrate/**') }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.rust-final.outputs.cache-hit != 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.rust-final.outputs.cache-hit != 'true'
        with:
          workspaces: "rust/substrate"
          cache-on-failure: true
          shared-key: "polaris-x86_64-unknown-linux-gnu"
      - name: Build Rust Substrate
        if: steps.rust-final.outputs.cache-hit != 'true'
        run: make rust-build

      - name: Upload Rust Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-libs
          path: |
            rust/substrate/target/release/libsubstrate.so
            rust/substrate/target/release/libsubstrate.a
          retention-days: 1

  # cargo test + fmt check 复用同一缓存（编译产物已被 rust-build 预热）
  rust:
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Skip if Rust code unchanged
        if: needs.rust-build.outputs.rust_unchanged == 'true'
        run: echo "Rust code unchanged. Skipping cargo test and fmt."
      - uses: actions/checkout@v7
        if: needs.rust-build.outputs.rust_unchanged != 'true'
      - name: Install Bubblewrap
        if: needs.rust-build.outputs.rust_unchanged != 'true'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: dtolnay/rust-toolchain@stable
        if: needs.rust-build.outputs.rust_unchanged != 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.rust-build.outputs.rust_unchanged != 'true'
        with:
          workspaces: "rust/substrate"
          cache-on-failure: true
          shared-key: "polaris-x86_64-unknown-linux-gnu"
          save-if: false
      - run: cargo test --manifest-path rust/substrate/Cargo.toml
        if: needs.rust-build.outputs.rust_unchanged != 'true'
      - run: cargo fmt --manifest-path rust/substrate/Cargo.toml --check
        if: needs.rust-build.outputs.rust_unchanged != 'true'

  test:
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Download Rust Artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-libs
          path: rust/substrate/target/release
      - name: Create mock web dist
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: spec consistency (state.yaml SSoT)
        run: go test -run "^TestSpec" ./internal/protocol/... -v
      - name: Go tests
        env:
          # 告知 Go 链接器 Rust .so 位置
          LD_LIBRARY_PATH: ${{ github.workspace }}/rust/substrate/target/release
        run: go test ./internal/... -v -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out

  build:
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Download Rust Artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-libs
          path: rust/substrate/target/release
      - name: Build
        env:
          SKIP_RUST_BUILD: 1
        run: make build

  rust-lint-deny:
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo-deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/substrate"
          cache-on-failure: true
          shared-key: "polaris-x86_64-unknown-linux-gnu"
          save-if: false
      - name: Install cargo-deny
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked
          fi
      - name: Run rust-lint and rust-deny
        run: |
          make rust-lint
          make rust-deny

  deadcode:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Create mock web dist
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Run deadcode
        run: make deadcode

  eval-gate:
    needs: [lint, test, build, rust, docs-toc, rust-lint-deny, deadcode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Download Rust Artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-libs
          path: rust/substrate/target/release
      - name: Create mock web dist
        run: mkdir -p web/dist && touch web/dist/index.html
      - name: Copy Rust libs
        run: |
          mkdir -p bin/lib
          cp rust/substrate/target/release/libsubstrate.so bin/lib/ 2>/dev/null || true
      # HE-4：Eval 门控不得静默跳过。
      #
      # 2026-08-10 修复：此前无论何种事件，缺 API Key 一律 `echo Skipped` 并以成功
      # 退出。对本仓库自身的 push / 同仓 PR 而言，这等于「忘配 Secret == 关掉防退化
      # 门控」，且分支保护看到的是绿灯——正是 HE-4 要拦的"跳过 Eval 直改阈值/Prompt/
      # 权重"。
      #
      # 分两种场景，因为二者的"缺 Key"含义完全不同：
      #   - fork PR：GitHub 按设计不下发 secrets，缺 Key 是平台行为而非配置疏漏。
      #     此时无法运行真实 eval，标记为待人工门控（维护者在可信分支上复跑后再合并），
      #     不阻断 fork 贡献者的其余检查。
      #   - 其余（push / 同仓 PR / 手动触发）：secrets 本应可用，缺 Key = 配置失效，
      #     直接 fail，把"门控没跑"这件事变成红灯而不是一行 warning。
      - name: Eval Gate (HE-4 fail-closed)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/bin/lib
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            echo "::notice::Detected API Key. Running real eval --ci-gate..."
            go run ./cmd/polaris eval --ci-gate
            exit $?
          fi

          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::fork PR 无法获取 secrets，Eval 门控未执行。合并前维护者必须在可信分支上复跑 \`go run ./cmd/polaris eval --ci-gate\`（HE-4）。"
            exit 0
          fi

          echo "::error::未检测到 DEEPSEEK_API_KEY / OPENAI_API_KEY，Eval 门控无法执行。HE-4 禁止跳过 Eval 门控——请在仓库 Settings -> Secrets 中配置后重跑。"
          exit 1

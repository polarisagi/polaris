name: read_file
description: "Read a text file. Returns numbered lines. Use offset/limit to read a range of a large file; without them at most 2000 lines / 64KB are returned and the total line count is reported."
version: "1.1.0"
capability: read-only
risk_level: low
sandbox: in-process
side_effects:
  - none
tags:
  - filesystem
  - io
  - read

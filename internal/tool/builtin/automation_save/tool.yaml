name: automation_save
description: |
  创建或修改定时自动化。kind=prompt：到点用 prompt 跑一轮完整 Agent（适合需要判断/多步推理的周期任务，最小间隔 60 分钟）。
  kind=pipeline：确定性采集管线（抓取→过滤去重→一次 LLM 汇总），适合来源确定的信息收集，token 消耗低得多。
  保存前先向用户复述：做什么、多久一次、结果发到哪里；能用 pipeline 的不要用 prompt。
  pipeline 示例：{"kind":"pipeline","name":"HN AI 日报","trigger":{"type":"cron","cron":"0 8 * * *"},
   "steps":[{"key":"hn","kind":"tool","tool":"feed_fetch","args":{"url":"https://hnrss.org/newest?q=AI&points=50"}},
    {"key":"new","kind":"transform","needs":["hn"],"ops":[{"op":"dedup","by":"url","scope":"workflow"},{"op":"limit","n":20}],"skip_if_empty":true},
    {"key":"digest","kind":"llm","needs":["new"],"input":"new","fields":["title","url","excerpt"],"prompt":"用中文列出 5 条要点并附链接"}]}
  先 dry_run=true 给用户看预览和预计 token，用户同意后再保存。
capability: write-local
risk_level: medium
sandbox: in-process
side_effects:
  - state-mutate

<!-- 项目页（ADR-0097）：项目 = 会话的运行上下文容器（工作目录 + 指令 + 信任 + 会话集合） -->
<div x-show="$store.nav.page === 'projects'" x-cloak class="flex-1 overflow-y-auto min-h-0 p-6 bg-base-100">
  <div class="max-w-3xl mx-auto w-full flex flex-col">
    <div class="mb-8 border-b border-base-300 pb-4 flex justify-between items-end">
      <div>
        <h2 class="text-2xl font-bold text-base-content" x-text="$store.i18n.t('projects_title')"></h2>
        <p class="text-sm text-base-content/60 mt-1" x-text="$store.i18n.t('projects_desc')"></p>
      </div>
      <div class="flex items-center gap-3">
        <label class="label cursor-pointer gap-2 p-0">
          <span class="text-xs text-base-content/60" x-text="$store.i18n.t('projects_show_archived')"></span>
          <input type="checkbox" class="toggle toggle-xs" x-model="$store.projects.showArchived">
        </label>
        <button class="btn btn-primary btn-sm" @click="$store.projects.openCreate()" x-text="$store.i18n.t('projects_new')"></button>
      </div>
    </div>

    <div x-show="$store.projects.loading" class="flex justify-center py-16"><span class="loading loading-spinner loading-lg text-primary"></span></div>

    <!-- 单列项目列表：点击行原地展开（手风琴，同时只展开一个），展开区只给最近会话 -->
    <div class="space-y-2" x-show="!$store.projects.loading">
      <template x-for="p in $store.projects.visible" :key="p.id">
        <div class="card bg-base-200 border transition-colors"
             :class="$store.projects.selectedID === p.id ? 'border-primary' : 'border-base-300 hover:border-primary/60'">
          <!-- 行头 -->
          <div class="card-body p-3 gap-1 cursor-pointer" @click="$store.projects.toggleProject(p.id)">
            <div class="flex items-center gap-2">
              <svg class="w-3 h-3 shrink-0 text-base-content/50 transition-transform" :class="$store.projects.selectedID === p.id ? 'rotate-90' : ''"
                   fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 5 7 7-7 7"/></svg>
              <h3 class="font-bold text-sm truncate flex-1" x-text="p.name"></h3>
              <span x-show="p.is_default" class="badge badge-primary badge-outline badge-sm" x-text="$store.i18n.t('projects_default_badge')"></span>
              <span x-show="p.archived" class="badge badge-ghost badge-sm" x-text="$store.i18n.t('projects_archived')"></span>
              <span x-show="p.trusted" class="badge badge-warning badge-sm" x-text="$store.i18n.t('projects_trusted_badge')"></span>
            </div>
            <div class="flex items-center gap-3 text-xs text-base-content/60 pl-5">
              <span class="font-mono truncate flex-1 min-w-0" x-text="p.root_path || $store.i18n.t('projects_no_dir')" :title="p.root_path"></span>
              <span class="shrink-0" x-text="$store.i18n.t('projects_session_count').replace('{0}', p.session_count)"></span>
              <span class="shrink-0 hidden sm:inline" x-text="new Date(p.updated_at || p.created_at).toLocaleString('zh-CN')"></span>
            </div>
          </div>

          <!-- 展开区 -->
          <div x-show="$store.projects.selectedID === p.id" x-cloak class="px-3 pb-3 space-y-3 border-t border-base-300 pt-3">
            <div class="flex flex-wrap gap-2">
              <button class="btn btn-primary btn-sm" @click="$store.projects.startChat(p.id)" x-text="$store.i18n.t('projects_new_chat')"></button>
              <button class="btn btn-ghost btn-sm" @click="$store.projects.openEdit(p)" x-text="$store.i18n.t('projects_edit')"></button>
              <template x-if="!p.is_default">
                <div class="flex gap-2">
                  <button class="btn btn-ghost btn-sm" @click="$store.projects.setArchived(p, !p.archived)"
                          x-text="p.archived ? $store.i18n.t('projects_unarchive') : $store.i18n.t('projects_archive')"></button>
                  <button class="btn btn-ghost btn-sm text-error hover:bg-error/10" @click="$store.projects.remove(p)"
                          x-text="$store.i18n.t('projects_delete')"></button>
                </div>
              </template>
            </div>

            <p x-show="p.instructions" class="text-sm text-base-content/70 whitespace-pre-wrap line-clamp-3" x-text="p.instructions"></p>

            <div>
              <div x-show="$store.projects.sessionsLoading" class="py-3 flex justify-center"><span class="loading loading-spinner loading-sm text-primary"></span></div>
              <p x-show="!$store.projects.sessionsLoading && $store.projects.sessions.length === 0"
                 class="text-sm text-base-content/50 py-2" x-text="$store.i18n.t('projects_empty_sessions')"></p>
              <div class="space-y-1">
                <template x-for="sess in $store.projects.sessions" :key="sess.id">
                  <div class="rounded-lg px-3 py-2 hover:bg-base-300/60 cursor-pointer transition-colors"
                       @click="$store.projects.openSession(sess)">
                    <div class="flex items-center gap-2 min-w-0">
                      <span x-show="$store.sessions.isRunning(sess)" class="relative flex h-2 w-2 shrink-0" :title="$store.i18n.t('session_running')">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
                      </span>
                      <h5 class="font-medium text-sm truncate" x-text="sess.title || sess.id"></h5>
                    </div>
                    <p class="text-xs text-base-content/60"
                       x-text="`${$store.i18n.t('sessions_msg_count').replace('{0}', sess.message_count || 0)}  ·  ${new Date(sess.updated_at || sess.created_at).toLocaleString('zh-CN')}`"></p>
                  </div>
                </template>
              </div>
              <button x-show="p.session_count > $store.projects.sessions.length && $store.projects.sessions.length > 0"
                      class="btn btn-link btn-sm px-3 mt-1 h-auto min-h-0 no-underline"
                      @click="$store.projects.viewAllSessions(p)"
                      x-text="$store.i18n.t('projects_view_all').replace('{0}', p.session_count) + ' →'"></button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- 新建 / 编辑 -->
  <div class="modal" :class="{'modal-open': $store.projects.form.open}">
    <div class="modal-box max-w-xl">
      <h3 class="font-bold text-lg mb-4"
          x-text="$store.projects.form.mode === 'create' ? $store.i18n.t('projects_new') : $store.i18n.t('projects_edit')"></h3>
      <div class="space-y-4">
        <label class="flex flex-col gap-1 w-full">
          <span class="text-sm opacity-70" x-text="$store.i18n.t('projects_name')"></span>
          <input type="text" class="input input-bordered w-full" maxlength="100" x-model="$store.projects.form.name">
        </label>

        <label class="flex flex-col gap-1 w-full" x-show="$store.projects.form.id !== 'default'">
          <span class="text-sm opacity-70" x-text="$store.i18n.t('projects_root')"></span>
          <input type="text" class="input input-bordered w-full font-mono text-sm" placeholder="/Users/me/code/my-repo"
                 x-model="$store.projects.form.root_path"
                 @input="if ($store.projects.form.mode === 'edit') $store.projects.form.trusted = false">
          <span class="text-xs text-base-content/50 mt-1" x-text="$store.i18n.t('projects_root_hint')"></span>
        </label>

        <label class="flex flex-col gap-1 w-full" x-show="$store.projects.form.id !== 'default'">
          <span class="text-sm opacity-70" x-text="$store.i18n.t('projects_instructions')"></span>
          <textarea class="textarea textarea-bordered w-full h-28" maxlength="8192" x-model="$store.projects.form.instructions"></textarea>
          <span class="text-xs text-base-content/50 mt-1" x-text="$store.i18n.t('projects_instructions_hint')"></span>
        </label>

        <div x-show="$store.projects.form.id !== 'default' && $store.projects.form.root_path.trim()"
             class="rounded-lg border border-warning/50 bg-warning/10 p-3">
          <label class="label cursor-pointer justify-start gap-3 p-0">
            <input type="checkbox" class="toggle toggle-warning toggle-sm" x-model="$store.projects.form.trusted">
            <span class="font-medium text-sm" x-text="$store.i18n.t('projects_trusted')"></span>
          </label>
          <p class="text-xs text-base-content/60 mt-2" x-text="$store.i18n.t('projects_trusted_warn')"></p>
        </div>

        <p x-show="$store.projects.form.error" class="text-error text-sm" x-text="$store.projects.form.error"></p>
      </div>
      <div class="modal-action">
        <button class="btn btn-ghost" @click="$store.projects.closeForm()" x-text="$store.i18n.t('projects_cancel')"></button>
        <button class="btn btn-primary" :disabled="$store.projects.form.saving" @click="$store.projects.save()">
          <span x-show="$store.projects.form.saving" class="loading loading-spinner loading-xs"></span>
          <span x-text="$store.i18n.t('projects_save')"></span>
        </button>
      </div>
    </div>
    <div class="modal-backdrop" @click="$store.projects.closeForm()"></div>
  </div>
</div>

version: "2"
linters:
  enable:
    - depguard
    - errorlint
    - forbidigo
    - gochecknoglobals  # 禁止 internal/ 包级可变全局变量（豁免见 exclusions）
    - gocyclo
    - misspell
    - nestif
    - nilerr
    - prealloc
    - unconvert
    - wrapcheck     # 错误包装统一走 apperr，禁止裸 errors/fmt 跨调用链泄漏
    # funlen 未启用：与 gocyclo 高度冗余，误报率偏高（Go 惯用的 err 处理天然拉长行数）
  settings:
    depguard:
      rules:
        L0_substrate:
          files:
            - '**/internal/llm/**'
            - '**/internal/store/**'
            - '**/internal/observability/**'
            - '**/internal/security/**'
          deny:
            - pkg: github.com/polarisagi/polaris/internal/agent
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/memory
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/prompt
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/tool
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/sandbox
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/action
              desc: L0 不可引 L1
            - pkg: github.com/polarisagi/polaris/internal/swarm
              desc: L0 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/learning
              desc: L0 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/knowledge
              desc: L0 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/eval
              desc: L0 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/gateway
              desc: L0 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/channel
              desc: L0 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/cli
              desc: L0 不可引 L3
        L1_cognition_action:
          files:
            - '**/internal/agent/**'
            - '**/internal/memory/**'
            - '**/internal/prompt/**'
            - '**/internal/tool/**'
            - '**/internal/sandbox/**'
            - '**/internal/action/**'
          deny:
            - pkg: github.com/polarisagi/polaris/internal/swarm
              desc: L1 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/learning
              desc: L1 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/knowledge
              desc: L1 不可引 L2
            - pkg: github.com/polarisagi/polaris/internal/eval
              desc: L1 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/gateway
              desc: L1 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/channel
              desc: L1 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/cli
              desc: L1 不可引 L3
        L2_swarm:
          files:
            - '**/internal/swarm/**'
            - '**/internal/learning/**'
            - '**/internal/knowledge/**'
          deny:
            - pkg: github.com/polarisagi/polaris/internal/eval
              desc: L2 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/gateway
              desc: L2 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/channel
              desc: L2 不可引 L3
            - pkg: github.com/polarisagi/polaris/internal/cli
              desc: L2 不可引 L3
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    forbidigo:
      forbid:
        - pattern: "^fmt\\.Errorf$"
          msg: "禁止使用裸 fmt.Errorf，请使用 apperr.Wrap"
        - pattern: "^errors\\.New$"
          msg: "禁止使用裸 errors.New，请使用 apperr.New"
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    wrapcheck:
      # 允许 apperr 自身及 stdlib errors 包不需要包装
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .New(
        - apperr.
      ignore-interface-regexps:
        - ^(?i)(Closed|Simple|IO)$
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件：errcheck/errorlint/forbidigo/gochecknoglobals/gocyclo/nestif/wrapcheck 全豁免
      # 测试用的裸 errors.New、未处理 error、fixture 全局变量均属正常惯用法
      - linters:
          - errcheck
          - errorlint
          - forbidigo
          - gochecknoglobals
          - gocyclo
          - nestif
          - wrapcheck
        path: _test\.go
      # ADR-0001：metrics 全局变量是 Prometheus 进程级单例，永久架构决策
      - linters:
          - gochecknoglobals
        path: internal/observability/metrics/
      # ADR-0011：purego FFI 函数指针绑定，dlopen 语义要求包级 var，永久架构决策
      - linters:
          - gochecknoglobals
        path: (internal/store/surreal_store\.go|internal/llm/(stt|tts)/sherpa\.go|internal/ffi/(llama|dylib|vec_ops)\.go|internal/tool/sandbox/rust_(wasmtime|native)_sandbox\.go|internal/security/policy/cedar_ffi\.go)
      # 进程级单例/sync.OnceValue 惰性初始化/atomic 原子量/只读静态查表，永久架构决策
      - linters:
          - gochecknoglobals
        path: (internal/memory/retrieval/query_classifier\.go|internal/observability/probe/feature_gate\.go|internal/security/network/safe_dialer\.go|internal/swarm/agents/security_audit_agent\.go|internal/downloader/proxy\.go|internal/extension/skill/generate\.go|internal/knowledge/graphrag/entity\.go|internal/action/capability_token\.go|internal/observability/trace/tracer\.go|internal/protocol/replay\.go|pkg/concurrent/safe_go\.go|internal/config/runtime\.go|internal/llm/adapter/http_client\.go|internal/llm/modelregistry/registry\.go|cmd/polaris/cli\.go|cmd/polaris/cli_i18n\.go|cmd/polaris/migrate_openclaw_memory\.go)
      # ldflags -X 注入版本信息要求包级 var，Go 工具链标准做法
      - linters:
          - gochecknoglobals
        path: (pkg/version/version\.go|cmd/polaris/version\.go|internal/config/config\.go)
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/polarisagi/polaris
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

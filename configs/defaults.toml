# polaris default configuration
# Tier: 0 (8GB RAM) - all remote API, no local model
# 系统参数与全局路径单一事实源: internal/config/system_params.go

[system]
tier = 0
max_agents = 3
go_memlimit_mb = 150
data_dir = "~/.polaris"
data_encryption_key = "" # 留空或配置外部 KMS，不要硬编码明文密钥
egress_allowed_domains = [] # 出站域名白名单（仅开启网络隔离时生效，空 = 允许所有）

[system.resource_governor]
# 资源控制阈值，低于指定阈值时触发对应降级保护
mem_l1_free_mb = 1536 # L1 警告：停止拉起新 Agent
mem_l2_free_mb = 1024 # L2 阻塞：挂起所有后台任务
mem_l3_free_mb = 512  # L3 濒死：强杀耗存最大的子进程
cpu_l1_pct = 80.0     # CPU 阈值：降低后台任务优先级
cpu_l2_pct = 95.0     # CPU 阈值：限制并发请求

# 运行时目录布局（默认均从 data_dir 自动派生，各目录均支持独立挂载到其他磁盘/分区）：
# 空字符串 = 使用默认派生路径
[system.dirs]
db_dir         = ""   # 数据库文件目录（默认 data_dir/data，存放 polaris.db, surreal.db）
logs_dir       = ""   # 系统运行日志目录（默认 data_dir/logs；示例："/var/log/polaris"）
models_dir     = ""   # 本地 AI 模型资产目录（默认 data_dir/models；示例："/mnt/data/models"）
workspace_dir  = ""   # Agent 任务沙箱隔离目录（默认 data_dir/workspace；示例："/tmp/polaris/workspace"）
bin_dir        = ""   # 外部可执行依赖目录（默认 data_dir/bin；示例："/opt/polaris/bin"）
config_dir     = ""   # 配置覆盖与提示词目录（默认 data_dir/config）
extensions_dir = ""   # 插件与 Marketplace 安装目录（默认 data_dir/extensions）
skills_dir     = ""   # 用户技能脚本目录（默认 data_dir/skills）
sessions_dir   = ""   # 会话历史转录记录（默认 data_dir/sessions）
audit_dir      = ""   # 审计轨迹与归档目录（默认 data_dir/audit）
cache_dir      = ""   # HTTP 与推理缓存目录（默认 data_dir/cache）
hooks_dir      = ""   # 用户事件 Hook 脚本目录（默认 data_dir/hooks）
tmp_dir        = ""   # 临时下载解压暂存目录（默认 data_dir/tmp）
run_dir        = ""   # 运行时状态目录（默认 data_dir/run，存放 pid/port/token/lock）
secrets_dir    = ""   # 机密凭据保护区（默认 data_dir/secrets）
eval_dir       = ""   # 离线评测数据集目录（默认 data_dir/eval）

# ── 下载配置 ────────────────────────────────────────────────────────────────
[download]
# GitHub 下载代理（仅中国大陆有意义；海外用户 auto 模式会自动跳过代理）
# "auto"                          → 自动探测：500ms 内可达 github.com 则直连（海外/VPN），
#                                   否则判定为中国大陆网络，按优先级切换镜像（默认）
# "off"                           → 始终直连，禁用代理
# "https://ghproxy.net"           → 强制使用主镜像（中国区推荐）
# "https://mirror.ghproxy.com"    → 强制使用备用镜像
# auto 模式下降级顺序：ghproxy.net → mirror.ghproxy.com → 直连
# 亦可通过环境变量设置（优先级更高）：export POLARIS_GITHUB_PROXY=https://ghproxy.net
github_proxy = "auto"

[inference]
default_provider = "deepseek-flash"
reasoning_provider = "deepseek-v4-pro"
structured_output = "grammar"
# 嵌入向量维度（须与实际嵌入模型一致，同时决定 SurrealDB HNSW DIMENSION）。
# 用户如果在下方 [embedding] 配置了外部大模型，此值必须与模型输出维度对应（如 OpenAI/DeepSeek 均为 1536）。
# 只有在用户未配置外部 API，且 FeatureGate 根据内存自动启用了本地 Ollama 时，此值才会被自动覆盖，无需手动修改：
#   FeatureMaxEmbedding  （Tier2, ≥12GB free）→ qwen3-embedding:8b   → 4096  MTEB 70.58
#   FeatureUltraEmbedding（Tier1, ≥6GB  free）→ qwen3-embedding:4b   → 2560  MTEB ~68
#   FeatureHQEmbedding   （Tier0, ≥3GB  free）→ qwen3-embedding:0.6b → 1024  MTEB 64.33
#   FeatureLocalEmbedding（Tier0, ≥256MB    ）→ nomic-embed-text     →  768  MTEB ~62
# 远程 API 默认路径：
#   OpenAI text-embedding-3-small / DeepSeek-Embedder → 1536
embedder_dim = 1536

[inference.cache]
enabled = true
backend = "pebble"

# ── 语音（STT/TTS）：按需下载、懒加载、空闲卸载（ADR-0107）──────────────────────
# 资产（动态库/模型）的 URL 与 sha256 由代码内清单 internal/llm/audioassets 钉死，不开放配置。
# 守护进程启动时不下载任何语音资产；前端首次点麦克风/朗读时调用 POST /v1/audio/{stt|tts}/install。
# 最低配置（按稳定硬件画像判定，空闲内存只决定"此刻能否加载"）：
#   STT  2GB 总内存 + 2 逻辑核（SenseVoice int8）
#   TTS  4GB 总内存 + 4 逻辑核（Kokoro v1.1 fp32；首次启用基准 RTF>0.7 则判 unsupported）
#   低于 TTS 门槛：前端退回浏览器/WebView 内置系统语音
[inference.audio]
idle_unload_minutes = 10   # 引擎空闲多久卸载释放内存；0 = 不卸载

[inference.stt]
# 留空 = 代码内钉死的 ABI 版本（1.13.2）。填其他值会让 STT/TTS 资产初始化报错：
# FFI 结构体偏移按 1.13.2 的 c-api.h 实测手写，换版本会内存破坏。
sherpa_version = "1.13.2"
language = "zh"
# 实测 use_itn=1 会丢首字、错词（"开放时间"→"放时间"），官方二进制同参数输出一致，属模型缺陷。
use_itn = false

# provider 二选一：
#   "sherpa" - 本地 sherpa-onnx Kokoro v1.1 fp32（离线；需 4GB/4 核；首次启用跑基准）
#   "http"   - 外部 HTTP sidecar（CosyVoice 2 / Qwen3-TTS 等 GPU 推理，高级可选）
# Edge TTS 已删除（ADR-0107）；旧配置里的 "edge" 加载时自动迁移为 "sherpa"。
[inference.tts]
provider = "sherpa"
# 前端朗读引擎偏好：auto（服务端就绪用服务端，否则系统语音）| server | system
engine = "auto"
sherpa_version = ""  # 留空复用 inference.stt.sherpa_version
kokoro_sid = 3       # Kokoro v1.1 说话人编号：3 = zf_001（中文女声）；0 = af_maple（美音）
speed = 1.0
http_endpoint = ""   # provider="http" 时填 "http://127.0.0.1:8000/tts"

[storage]
# Tier0 SQLite 内存余弦向量扫描的最大行数上限，防止全表扫描导致 OOM（见 docs/specs/09-LLM-Agent-Production.md A-14）。
# <=0 时代码内回退默认值 500（internal/config/config.go），此处显式声明保持配置可发现性。
tier0_vector_scan_limit = 500
# SQLite 关系型与向量核心数据库主文件名（存放于 system.dirs.db_dir 下，默认 polaris.db）
sqlite_db_filename = "polaris.db"
# SurrealDB 认知图谱与文档数据库文件名（存放于 system.dirs.db_dir 下，默认 surreal.db）
surreal_db_filename = "surreal.db"

[storage.engines]
relational = "sqlite"
vector = "sqlite-vec"
graph = "loradb"
kv = "pebble"
fulltext = "sqlite-fts5"
eventlog = "wal"

[observability.traces]
enabled = true
sampler = 1.0

[observability.metrics]
enabled = true

[observability.logs]
level = "info"
format = "json"

[agent]
# 用户显式声明信任的工作区绝对路径前缀（GD-14-005）。
# 命中的工作区，其 AGENTS.md / CLAUDE.md / .polaris_context.md 会作为项目级
# 系统指令写入 ZoneImmutable；未命中则按 TaintHigh 进 ZoneExternalCatalog 加围栏。
#
# 默认必须为空——Agent 处理 clone 来的仓库时，其中的 AGENTS.md 完全是攻击者
# 可控的，无条件信任等于开一条直通系统提示词的注入通路。只把你自己的项目
# 目录加进来，例："/home/me/myproject"。相对路径会被忽略。
trusted_workspace_roots = []

# HITL 自适应降级（GD-14-004）。0 = 关闭（默认）。
# 开启前请先看 polaris.hitl.decisions_total 指标，确认某类 checkpoint 的
# human 批准率确实长期接近 100%（已退化为习惯性点击）再按需调高。
# 即使开启也只降级为"通知"，且污点/高风险/设备操控/L4 晋升一律不参与降级。
hitl_trust_min_approvals = 0
hitl_trust_window_hours = 24

[agent.kernel]
state_machine = "dual_route"
default_surprise_threshold = 0.5

[agent.memory]
layers = ["working", "episodic", "semantic", "procedural"]
consolidation = "manual"

[agent.skill]
builtin_path = "skills/"
max_logic_collapse_concurrent = 1
web_search_engine = "duckduckgo"
web_search_api_key = ""

[orchestrator]
mode = "blackboard"
protocol = "structured_event"
# 终态任务保留秒数（86400 = 24h）。到期由 Blackboard Reaper 归档进 decision_log
# 后物理删除（GD-13-004）。0 = 用代码默认 24h；低于 300 秒的取值会被拒绝。
task_retention_ttl_sec = 86400

[self_improve]
gradient = false
auto_curriculum = false

[self_improve.logic_collapse]
enabled = true
min_success_for_trigger = 50

[knowledge.rag]
mode = "hybrid"
graphrag = "microsoft"

[policy]
engine = "cedar"
default_block = true
# Cedar 裁决生效模式："shadow"（默认，仅记录不裁决）/ "deny"（Cedar 明确拒绝强制生效，Go 规则仅兜底 allow）/
# "full"（完全生效）。Cedar 实体存储尚未完整实现前，"deny" 是推荐的生产配置——既杜绝 Cedar 拒绝被静默旁路，
# 又不会因实体存储不完整而误伤合法 allow 请求。
cedar_enforce_mode = "shadow"
# Cedar 策略文件路径覆盖（空 = 使用二进制内置 embed 默认策略，无需修改）。
# 运营商如需自定义策略，将 Cedar 文件放到指定路径后重启进程即可，无需重新编译。
# 示例：hard_constraints_path = "/etc/polaris/policy/hard_constraints.cedar"
hard_constraints_path = ""
soft_constraints_path = ""

[eval]
ci_gate = true
shadow_deploy = false
safety_keywords = ["DROP TABLE", "DELETE FROM", "rm -rf", "curl http://169.254", "eval(", "__import__", "os.system"]

[interface]
host = "127.0.0.1"
port = 28888
cli = true
http = true
grpc = false
websocket = false
# MCP Apps（io.modelcontextprotocol/ui）沙箱代理监听器（M8f-1）。0 = port+1；
# apps_sandbox_origin / apps_host_origin 仅反向代理部署需要显式配置（沙箱与 Web UI 的对外源）。
apps_sandbox_port = 0
apps_sandbox_origin = ""
apps_host_origin = ""
apps_enabled = true

[security]
# Tier 3（≥64GB）本地大模型专用的出站网络彻底隔离模式：为真时启用 NetworkSandbox
# （loopback-only + LocalProvider 内存预算守卫），fail-closed，任一环节失败阻止启动。
# 见 docs/arch/M11-Policy-Safety.md §5 local_only 模式。Tier 0/1/2 不应开启（无本地模型）。
local_only_mode = false

[sandbox]
# 是否启用平台原生进程隔离（macOS Seatbelt / Linux bubblewrap / Windows WSL2）。
# false = 仅 env 清理 + workDir，用于调试或受信任环境。
enabled        = true
# 网络访问策略："block"（默认，对齐 Claude Code）或 "allow"。
network_policy = "block"
# Linux bubblewrap 可执行路径，空 = 自动从 PATH 查找。
bwrap_path = ""
# Agent 可访问的额外文件系统路径白名单。
# DataDir（~/.polaris）始终自动包含，无需重复填写。
# 加入后，read_file / list_dir / glob / grep / bash / git_diff 等所有文件工具均可访问该路径。
# 示例（取消注释并按需修改）：
# allowed_paths = ["/home/user/projects", "/tmp"]
allowed_paths = []
# 可信来源（TrustOfficial 及以上）在 Wasm/Container/Remote 均不可用时，是否
# 允许降级到 InProcess 执行。默认 false（fail-closed）：可信 ≠ 稳定，可信来源
# 的代码仍可能死循环/内存爆炸/panic，InProcess 执行会直接拖垮宿主进程——这是
# 稳定性维度的风险，与"可信"这一安全维度判断是两回事（阶段03 R-05）。
# 仅开发环境未编译 Wasm 引擎、或明确接受该风险时置 true。
allow_trusted_inprocess_fallback = false

[sandbox.remote]
# 远端云沙箱（Sbx-L4）：Tier-0 本地无法启动 L3 容器沙箱或需要更高计算力/隔离度时
# （如 Python 数据科学类 Skill），将工具执行委托给远端 HTTP 执行器（自托管 VPS、
# E2B、Modal、Daytona 等任意兼容端点）。涉及代码/数据离开本机发往第三方服务，
# 默认关闭，需显式配置 endpoint 后启用（[Tier-0-Limit]：可选能力，非硬依赖）。
enabled = false
# 远端执行器根 URL，如 "https://executor.example.com"。enabled=true 时必填。
endpoint = ""
# Bearer 认证令牌。留空则读取 POLARIS_REMOTE_SANDBOX_TOKEN 环境变量（避免密钥明文落盘）。
auth_token = ""
# 单次调用超时秒数。0 = 默认 300s（对应重计算场景）。
timeout_sec = 0

[cognition]
# SurrealDB 认知存储后端（运行时选择，不影响编译）。
# "rocksdb" = kv-rocksdb 持久化（默认），数据落盘 data/surreal.db，RSS ~200MB。
#             系统自动根据内存降级：
#               TotalRAM < 2GB  → SurrealDB 完全跳过，cognitive axis → SQLite
#               2GB ≤ RAM < 4GB → 强制降级为 "mem"（进程重启数据丢失）
#               TotalRAM ≥ 4GB  → 使用本配置值（默认 "rocksdb"，持久化）
# "mem"     = kv-mem 进程内存，重启丢失，可手动设置强制 mem 模式（如低配 VPS）。
surreal_backend = "rocksdb"
surreal_db_path = ""
# Tokio 运行时工作线程数（影响 SurrealDB 并发写入吞吐与内存占用）。
# 0  = auto（min(CPU 核心数, 4)）—— ≥8GB 机器自动选择。
# 2  = 4GB 内存机器推荐，节省约 30-50MB RSS。
surreal_worker_threads = 2

[compressor]
# 模型上下文窗口大小（token 数）。自动压缩阈值 = context_window × auto_compact_pct / 100。
# Tier-0 默认 32768（DeepSeek V3 实际窗口远大于此，可按需调高）。
context_window   = 32768
# 自动压缩触发百分比，对齐 Claude Code 默认值 95%。
auto_compact_pct = 95.0
# 上下文使用率警告触发百分比（黄色 Banner 提示用户）。
warn_pct         = 80.0
# 连续自动压缩但仍超阈值的最大次数；超出后停止自动压缩并显示抖动告警。
max_thrash_count = 3

# ── 向量化服务（Tier 2 Ambient 匹配 + Extension Catalog 预计算）─────────────────
# 系统完全遵循“用户配置优先”。只要配置了 base_url，即强制使用该远程模型，绝不会自动拉取本地模型。
# 只有在 base_url 留空时，系统才可能根据可用内存在后台尝试启动本地 Ollama 作为回退（Fallback）。
# 若本地模型也不可用，所有检索将优雅降级到 Tier 1（基于关键词的 FTS 搜索）。
#
# 提示：首次配置好下方的大模型后，可在系统中触发市场同步（local_only），即可将历史缺少的插件向量全部补齐。
# 示例: base_url = "https://api.deepseek.com/v1", model = "deepseek-embed"
[embedding]
base_url  = ""
model     = ""
# api_key 留空时读 POLARIS_EMBEDDING_API_KEY 环境变量
api_key   = ""
# 余弦相似度阈值，低于此值的技能/扩展不注入
similarity_threshold = 0.60

[a2a]
enabled = true
name = "polaris-agent-0"
skills = ["general", "coding", "planning"]

# Example threshold overrides for m1_router.toml
# To use, copy this file to ~/.polarisagi/polaris/config/ or point POLARIS_THRESHOLDS_DIR to this directory.

'circuit_breaker.failure_count' = 5
'circuit_breaker.cooldown_seconds' = 10
'circuit_breaker.half_open_max' = 1
safecall_infer_timeout_seconds = 15
safecall_stream_idle_timeout_seconds = 60
'pre_flight.cost_tolerance_pct' = 15
'timeout.dial_seconds' = 3
'timeout.tls_seconds' = 5
'timeout.response_header_seconds' = 30
'timeout.total_seconds' = 120
'stream.max_buffer_kb' = 256
'l1.target_hit_rate' = 0.9
'semantic_cache.max_entries' = 10000
'semantic_cache.similarity_threshold' = 0.95
'semantic_cache.ttl_hours' = 24
'response_cache.enabled' = true
'response_cache.ttl_hours' = 168
'response_cache.max_entries' = 20000
'response_cache.purposes' = ['graphrag_extract', 'graphrag_summary', 'graphrag_community', 'graphrag_concept', 'rag_summary_tree', 'rag_query_rewrite', 'memory_write_filter']
window_breaker_window_secs = 60
window_breaker_min_samples = 20
window_breaker_threshold = 0.5
window_breaker_cooldown_sec = 30
'embed.batch_window_ms' = 10
'embed.high_max_batch_size' = 100
'embed.low_max_batch_size' = 8
'embed.call_timeout_s' = 30
'offpeak.windows' = []
'usage.retention_days' = 90
'anthropic.cache_ttl' = '5m'
'openai.prompt_cache_retention' = ''

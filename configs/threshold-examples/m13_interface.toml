# Example threshold overrides for m13_interface.toml
# To use, copy this file to ~/.polaris/config/ or point POLARIS_THRESHOLDS_DIR to this directory.

'timeout.read_seconds' = 10
'timeout.write_seconds' = 60
'timeout.idle_seconds' = 120
'timeout.graceful_shutdown_seconds' = 30
'hitl.default_deadline_min_urgent' = 5
'hitl.default_deadline_min_normal' = 60
'hitl.default_deadline_min_long' = 1440
'worker.intent_handler' = 4
'worker.ingest' = 2
'worker.background' = 2
'worker.eval' = 1
'worker.cron' = 1
max_concurrent_llm_calls = 4
lazy_load_tool_threshold = 40
ambient_skill_max_chars = 4000
'automation.prompt_min_interval_min' = 60
'automation.agent_max' = 20
'pipeline.min_interval_min' = 15
'pipeline.max_steps' = 20
'pipeline.step_data_max_bytes' = 1048576
'pipeline.run_data_keep_runs' = 20
'pipeline.seen_items_ttl_days' = 90
'pipeline.llm_max_input_chars' = 24000
'pipeline.llm_max_output_tokens' = 2000
'pipeline.write_allowlist' = ['knowledge_ingest', 'mcp__polaris-knowledge-base__kb_save']
'turn_steps.retention_days' = 0

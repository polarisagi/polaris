<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Polaris</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #0f1115; color: #e6e8ee;
  }
  .box { text-align: center; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #8b5cf6;
    margin: 0 auto 18px; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.85) } 50% { opacity: 1; transform: scale(1.15) } }
  .hint { color: #8a90a2; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <div>正在启动 Polaris…</div>
    <div class="hint">首次启动需要初始化数据库与模型，可能要等十几秒</div>
  </div>
</body>
</html>
